name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Check mods.toml in the jar
        run: |
          for jar in build/libs/*.jar; do
            echo "== $jar"
            unzip -p "$jar" META-INF/mods.toml | tee /tmp/mods.toml
            python3 -c "import tomllib; tomllib.load(open('/tmp/mods.toml','rb')); print('mods.toml OK')"
          done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: dmz-ssj4-armors
          path: build/libs/*.jar
          if-no-files-found: error
